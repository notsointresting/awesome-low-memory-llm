name: Submit a benchmark
description: Provide reproducible memory and performance measurements
title: "[Benchmark] "
labels: ["benchmark"]
body:
  - type: input
    id: project
    attributes:
      label: Runtime + version/commit
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Exact model revision and quantization
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Hardware, OS, storage, commands, and run settings
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Peak RAM, peak VRAM, disk usage, tokens/sec, latency, and logs
      description: State units and context/prompt/generation length. Put N/A where unavailable.
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence level
      options: ["Independently reproduced", "Community-reported", "Author-reported"]
    validations:
      required: true
